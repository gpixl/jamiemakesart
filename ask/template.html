  <body style="background: #9e707d; padding: 2%;"><a href="/" class="link" style="background-color:#905b6a">Back</a>

    <div class="entries">

              <div class="submitbox" id="submitbox">
                <div id="submitting">
                      <input class="input" type="text" id="username" maxlength="32" placeholder="Name (optional)"><br>
                      <textarea class="input" id="inputfield" maxlength="512" placeholder="Ask a question or say something silly and I may answer it"></textarea>
                      <br>
                      <input class="input button" type="submit" id="submitted" value="Submit" onclick="getVal()">
                </div>
              
              </div>

        <div class="askquestion" id="pendingresponse" style="display:none"><p>You submitted this question. It's now pending approval and I might answer it eventually! Wow</p><i class="question" id="pendingtext"></i>
        <br><input class="input button" type="submit" id="reset" value="Submit another" onclick="resetHash()"></div>
        
        <div class="box"><img src="askpage.gif"></div>

        
    </div>
    <div class="boxes"><p></p></div>

<style>

.box {
  background-color: transparent;
}

canvas {
  image-rendering: pixelated;
}

.submitbox {
  display: block;
  padding: 1em;
}

  .askquestion {
  max-width: 600px;
  display: block;
  padding: 15px;
  margin: 20px;
  color: white;
}

.askquestion p {
  margin: 8px;
}

.askquestion img {
  height: 128px;
  margin: 1px;
}

hr {
  width: 50%;
  color: #f2d5da;
  margin-top: 4em;
}

textarea {
  width: 200px;
  height: 150px;
  min-width: 150px;
}

.entries {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
}

.input {
  font-family: sans-serif;
  font-size: 15px;
  background-color: #f2d5da;
  color: rgb(28, 27, 104);
  padding: 12px;
  border: none;
  margin: 3px;
}

.input:focus {
  outline: 2px solid rgb(28, 27, 104);
}

.button {
  border-radius: 25px;
}

.button:hover {
  outline: 1px solid rgb(28, 27, 104);
}

.date {
  filter: opacity(0.4);
  font-size: 80%;
}

.question {
  display: block;
  filter: opacity(1.0);
  background-color: #f2d5da;
  padding: 15px;
  color: rgb(101, 79, 133);
}

@media all and (max-width:500px) {
  body {
    margin: 0px;
  }

    padding: 0px;
  }
