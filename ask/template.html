<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="https://jamiemakes.art/assets/favicon.png" />
    <title>Ask me things</title>
    <link rel="stylesheet" href="../style.css?v=8" />
    <script src="../script.js?v=4" defer></script>
  </head>
  <body style="padding: 1%;">

    <div class="boxes">


      <div class="box">
        <div>
          <a href="/" class="link"><img class="icon" src="../icons/home.png">Home</a>
          <div class="entries">
                    <div class="submitbox" id="submitbox">
                      <div id="submitting">
                            <input class="input" type="text" id="username" maxlength="32" placeholder="Name (optional)"><br>
                            <textarea class="input" id="inputfield" style="max-width: 400px;" maxlength="1024" placeholder="Ask a question or say something silly and I may answer it"></textarea>
                            <br>
                            <input class="link" type="submit" id="submitted" value="Submit" onclick="getVal()">
                      </div>
                    </div>


              <div class="askquestion" id="pendingresponse" style="display:none; max-width: 300px;"><p>You submitted this question. It's now pending approval and I might answer it eventually! Wow</p><i class="question" id="pendingtext"></i>
              <br><input class="link" type="submit" id="reset" value="Submit another" onclick="resetHash()"></div>
          </div>
        </div>
      </div>
      <div class="box">
        <div class="entries">
          


    <!-- QUESTIONS GO HERE -->


        </div>
      </div>
    </div>
  </body>
</html>

<script src="script.js"></script> 

<style>

.boxes {
  flex-direction: row-reverse;
}

.box {
  max-width: 700px;
  align-self:baseline;
}

canvas {
  image-rendering: pixelated;
}

.submitbox {
  display: block;
  padding: 1em;
}

  .askquestion {
  max-width: 600px;
  display: block;
  padding: 15px;
  margin: 20px;
  color: white;
}

.askquestion p {
  margin: 8px;
}

.askquestion img {
  height: 128px;
  margin: 1px;
}


textarea {
  width: 200px;
  height: 150px;
  min-width: 150px;
}

.entries {
  display: flex;
  flex-wrap: wrap;
  align-items: left;
  justify-content: left;
}

.link {
  border: none;
  font-family: serif;
}

.input {
  font-family: serif;
  font-size: 15px;
  background: #131629;
  padding: 12px;
  color: white;
  border: none;
  margin: 3px;
}

.input:focus {
  outline: 1px solid white
}



.date {
  filter: opacity(0.4);
  font-size: 80%;
}

.question {
  display: block;
  filter: opacity(1.0);
  background: #131629;
  padding: 15px;
}

@media all and (max-width:500px) {
  body {
    margin: 0px;
  }

  .askquestion {
    padding: 0px;
  }
}
