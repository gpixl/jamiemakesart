<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="https://cdn.glitch.global/bd293175-619c-40b5-82fd-e66ca60679e1/Telescope%20PFP.png?v=1729662484998" />
    <title>Jamie's Website</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="boxes">
      <h1>Ask</h1>
    </div>
    <div class="entries">


      <div class="box">
        <div id="submitting">
              <input class="input" type="text" id="username" maxlength="32" placeholder="Name (optional)"><br>
              <textarea class="input" id="inputfield" placeholder="Ask a question"></textarea>
              <br>
              <input class="input" type="submit" id="submitted" value="Submit" onclick="getVal()">
        </div>

        <div id="pendingresponse" style="display:none">
              <text>Your question has been submitted:</text><br>
              <i id="pendingtext" class="question"></i>
              <br><br>
              <p>Wait patiently for your response!</p>
        </div>
        
        <div id="done" style="display: none;">
            <text style="color:white">Thank u for submitting :P</text><br>
        </div>
      </div>

<!-- QUESTIONS GO HERE -->


    </div>
  </body>
</html>
