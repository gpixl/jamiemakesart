<script>

	chars = " ,abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ.!?-'()";
	mixchars = "uMARjmKLTDphXws?voF -Gb,OEySdiJCqlgPce.nzYZxHV'tQIkfaBNWrU![]";

	allnotes = document.getElementsByClassName("notecontents")

	function unmix(text) {
		newtext = ""
		for(a=0; a < text.length; a++) {
			if(mixchars.includes(text[a])) {
				index = mixchars.indexOf(text[a])
				newtext = chars[index] + newtext;
			} else {
				newtext = text[a] + newtext;
			}
		}
		return newtext
	}

	function disableall(id) {
		journaltext = document.getElementById(id)
		for(i = 0; i < allnotes.length; i++) {
			if (allnotes[i] != journaltext) {
				allnotes[i].style.display = "none";
				console.log(allnotes[i])
			}
		}
	}

	function flip(id, clicker) {
		disableall(id)

		journaltext = document.getElementById(id)
		if (journaltext.style.display == "inline") {
			journaltext.style.display = "none"
		} else {
			journaltext.style.display = "inline"
		}
	}

	function unscramble(id, clicker) {
		disableall(id)

		clicker.style = "color:blue;";

		clicker.onclick = function() {flip(id, clicker);};
		journaltext = document.getElementById(id)
		journaltext.style.display = "inline"
		sections = journaltext.innerHTML.split("=s=")
		all = ""
		for(i=0; i < sections.length; i++) {
			s = sections[i]
			if(!s.includes("<img") && !s.includes("<br>")) {
				s = unmix(s)
			}
			all += s;
		}
		journaltext.innerHTML = all;
	}

</script>
